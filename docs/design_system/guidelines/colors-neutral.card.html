<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;font-family:var(--font-sans);background:var(--surface-page);padding:18px}
.row{display:flex;gap:8px}
.sw{flex:1;height:96px;border-radius:var(--radius-sm);display:flex;flex-direction:column;justify-content:flex-end;padding:8px;box-sizing:border-box;font-size:10px;font-weight:600;border:1px solid rgba(0,0,0,.05)}
</style></head><body>
<div class="row">
<div class="sw" style="background:var(--ink-900);color:#fff">900</div>
<div class="sw" style="background:var(--ink-700);color:#fff">700</div>
<div class="sw" style="background:var(--ink-600);color:#fff">600</div>
<div class="sw" style="background:var(--ink-500);color:#fff">500</div>
<div class="sw" style="background:var(--ink-400);color:#fff">400</div>
<div class="sw" style="background:var(--ink-300);color:var(--ink-900)">300</div>
<div class="sw" style="background:var(--ink-200);color:var(--ink-900)">200</div>
<div class="sw" style="background:var(--ink-100);color:var(--ink-900)">100</div>
</div>
</body></html>
