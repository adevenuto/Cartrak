<!-- @dsCard group="Spacing" viewport="700x160" name="Corner radius" subtitle="xs 8 · sm 12 · md 16 · lg 22 · xl 28 · pill" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;font-family:var(--font-sans);background:var(--surface-page);padding:22px;color:var(--ink-900)}
.row{display:flex;gap:14px;align-items:center}
.b{display:flex;flex-direction:column;align-items:center;gap:8px}
.sq{width:74px;height:74px;background:var(--white);box-shadow:var(--shadow-md);border-top:3px solid var(--red-500)}
.b em{font-style:normal;font-size:10px;color:var(--ink-500);font-weight:600}
</style></head><body>
<div class="row">
<div class="b"><div class="sq" style="border-radius:var(--radius-xs)"></div><em>xs · 8</em></div>
<div class="b"><div class="sq" style="border-radius:var(--radius-sm)"></div><em>sm · 12</em></div>
<div class="b"><div class="sq" style="border-radius:var(--radius-md)"></div><em>md · 16</em></div>
<div class="b"><div class="sq" style="border-radius:var(--radius-lg)"></div><em>lg · 22</em></div>
<div class="b"><div class="sq" style="border-radius:var(--radius-xl)"></div><em>xl · 28</em></div>
<div class="b"><div class="sq" style="border-radius:var(--radius-pill)"></div><em>pill</em></div>
</div>
</body></html>
