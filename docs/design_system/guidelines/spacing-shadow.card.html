<!-- @dsCard group="Spacing" viewport="700x180" name="Elevation & shadows" subtitle="Soft low-contrast lift + crimson glow" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;font-family:var(--font-sans);background:var(--surface-page);padding:26px;color:var(--ink-900)}
.row{display:flex;gap:20px}
.b{display:flex;flex-direction:column;align-items:center;gap:10px}
.sq{width:96px;height:66px;background:var(--white);border-radius:var(--radius-md)}
.b em{font-style:normal;font-size:10px;color:var(--ink-500);font-weight:600}
</style></head><body>
<div class="row">
<div class="b"><div class="sq" style="box-shadow:var(--shadow-xs)"></div><em>xs</em></div>
<div class="b"><div class="sq" style="box-shadow:var(--shadow-sm)"></div><em>sm</em></div>
<div class="b"><div class="sq" style="box-shadow:var(--shadow-md)"></div><em>md · card</em></div>
<div class="b"><div class="sq" style="box-shadow:var(--shadow-lg)"></div><em>lg</em></div>
<div class="b"><div class="sq" style="box-shadow:var(--shadow-brand);background:var(--red-500)"></div><em>brand glow</em></div>
</div>
</body></html>
