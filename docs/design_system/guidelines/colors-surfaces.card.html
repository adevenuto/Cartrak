<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces & Status" subtitle="Canvas, card, sunken, tint — plus success/warning/danger" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;font-family:var(--font-sans);background:var(--surface-page);padding:18px}
.row{display:flex;gap:10px;margin-bottom:10px}
.sw{flex:1;height:60px;border-radius:var(--radius-sm);display:flex;align-items:flex-end;padding:8px;box-sizing:border-box;font-size:10px;font-weight:600;border:1px solid rgba(0,0,0,.06)}
</style></head><body>
<div class="row">
<div class="sw" style="background:var(--surface-page)">page</div>
<div class="sw" style="background:var(--surface-card)">card</div>
<div class="sw" style="background:var(--surface-sunken)">sunken</div>
<div class="sw" style="background:var(--surface-page-tint)">tint</div>
</div>
<div class="row">
<div class="sw" style="background:var(--success);color:#fff">success</div>
<div class="sw" style="background:var(--warning);color:#fff">warning</div>
<div class="sw" style="background:var(--danger);color:#fff">danger</div>
</div>
</body></html>
