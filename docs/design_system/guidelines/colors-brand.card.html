<!-- @dsCard group="Colors" viewport="700x150" name="Brand — Crimson scale" subtitle="Primary red 500; hover 600, press 700" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;font-family:var(--font-sans);background:var(--surface-page);padding:18px}
.row{display:flex;gap:10px}
.sw{flex:1;height:96px;border-radius:var(--radius-md);display:flex;flex-direction:column;justify-content:flex-end;padding:10px;box-sizing:border-box;color:#fff}
.sw small{opacity:.85;font-size:10px;font-weight:600}
.sw b{font-size:12px;font-weight:700}
</style></head><body>
<div class="row">
<div class="sw" style="background:var(--red-50);color:var(--ink-900)"><b>50</b><small>#FBE9EC</small></div>
<div class="sw" style="background:var(--red-100);color:var(--ink-900)"><b>100</b><small>#F6CDD4</small></div>
<div class="sw" style="background:var(--red-300)"><b>300</b><small>#E06277</small></div>
<div class="sw" style="background:var(--red-500)"><b>500 · brand</b><small>#C1122F</small></div>
<div class="sw" style="background:var(--red-600)"><b>600 · hover</b><small>#A70F29</small></div>
<div class="sw" style="background:var(--red-700)"><b>700 · press</b><small>#880C21</small></div>
</div>
</body></html>
