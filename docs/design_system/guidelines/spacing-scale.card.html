<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4px base grid, 1–16" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;font-family:var(--font-sans);background:var(--surface-card);padding:22px;color:var(--ink-900)}
.row{display:flex;align-items:flex-end;gap:14px}
.b{display:flex;flex-direction:column;align-items:center;gap:6px}
.box{background:var(--red-500);border-radius:4px}
.b em{font-style:normal;font-size:10px;color:var(--ink-500);font-weight:600}
</style></head><body>
<div class="row">
<div class="b"><div class="box" style="width:4px;height:4px"></div><em>1·4</em></div>
<div class="b"><div class="box" style="width:8px;height:8px"></div><em>2·8</em></div>
<div class="b"><div class="box" style="width:12px;height:12px"></div><em>3·12</em></div>
<div class="b"><div class="box" style="width:16px;height:16px"></div><em>4·16</em></div>
<div class="b"><div class="box" style="width:24px;height:24px"></div><em>6·24</em></div>
<div class="b"><div class="box" style="width:32px;height:32px"></div><em>8·32</em></div>
<div class="b"><div class="box" style="width:48px;height:48px"></div><em>12·48</em></div>
<div class="b"><div class="box" style="width:64px;height:64px"></div><em>16·64</em></div>
</div>
</body></html>
