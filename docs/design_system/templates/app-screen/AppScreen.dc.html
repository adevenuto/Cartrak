<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="CarTrak App Screen" description="Mobile app screen scaffold — status bar, header, content, primary CTA, using CarTrak tokens & components" -->
<helmet>
<script src="./ds-base.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Lora:wght@400;500&display=swap">
<style>*{box-sizing:border-box}body{margin:0}</style>
</helmet>
<div style="min-height:100vh;background:#FBE9EC;display:flex;align-items:center;justify-content:center;padding:24px;font-family:'Plus Jakarta Sans',sans-serif">
  <div style="width:390px;height:800px;background:#ECEAEB;border-radius:42px;overflow:hidden;box-shadow:0 40px 90px rgba(26,26,26,0.28);display:flex;flex-direction:column">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 26px 6px;color:#1A1A1A">
      <span style="font-weight:700;font-size:15px">9:41</span>
      <span style="font-weight:700;font-size:12px;letter-spacing:.08em">● ● ●</span>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 20px">
      <div style="width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(26,26,26,.06);display:flex;align-items:center;justify-content:center;font-weight:700;color:#1A1A1A">‹</div>
      <span style="font-weight:700;font-size:16px;color:#1A1A1A">Vehicle Health</span>
      <div style="width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(26,26,26,.06);display:flex;align-items:center;justify-content:center;color:#C1122F">♥</div>
    </div>
    <div style="flex:1;overflow-y:auto;padding:16px 20px 24px">
      <div style="background:linear-gradient(135deg,#C1122F,#880C21);border-radius:22px;padding:24px;color:#fff;box-shadow:0 10px 24px rgba(193,18,47,.30)">
        <div style="font-size:13px;font-weight:600;opacity:.85">Overall condition</div>
        <div style="font-size:44px;font-weight:800;line-height:1;margin-top:6px">85<span style="font-size:22px;font-weight:600;opacity:.7"> / 100</span></div>
        <div style="font-family:'Lora',serif;font-size:14px;opacity:.9;margin-top:8px">Your car is in great shape. Next service due in 1,200 mi.</div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px">
        <x-import component-from-global-scope="CarTrakDesignSystem_588b8a.StatCard" label="Engine Health" value="92%" hint-size="100%,86px"></x-import>
        <x-import component-from-global-scope="CarTrakDesignSystem_588b8a.StatCard" label="Tire Condition" value="85%" hint-size="100%,86px"></x-import>
        <x-import component-from-global-scope="CarTrakDesignSystem_588b8a.StatCard" label="Battery Health" value="78%" hint-size="100%,86px"></x-import>
        <x-import component-from-global-scope="CarTrakDesignSystem_588b8a.StatCard" label="Fuel Efficiency" value="88%" hint-size="100%,86px"></x-import>
      </div>
      <div style="font-weight:800;font-size:20px;color:#1A1A1A;margin:22px 0 12px">Recommended</div>
      <div style="background:#fff;border-radius:22px;padding:18px;box-shadow:0 8px 24px rgba(26,26,26,.07)">
        <div style="font-weight:700;font-size:16px;color:#1A1A1A">Full Vehicle Inspection</div>
        <div style="font-family:'Lora',serif;font-size:14px;color:#6B6B6B;margin:6px 0 14px">A complete 45-minute diagnostic across all systems.</div>
        <x-import component-from-global-scope="CarTrakDesignSystem_588b8a.Button" variant="primary" block="true" hint-size="100%,50px">Book inspection</x-import>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
