<!-- @dsCard group="CarTrak App" viewport="460x900" name="CarTrak — Mobile App" subtitle="Interactive: onboarding → home → services → scan" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>CarTrak App</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<style>
  html,body{margin:0;height:100%}
  body{font-family:var(--font-sans);background:var(--surface-page-tint);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px 0}
  *{box-sizing:border-box}
  ::-webkit-scrollbar{width:0;height:0}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" src="kit.jsx"></script>
<script type="text/babel" src="HeroScreen.jsx"></script>
<script type="text/babel" src="HomeScreen.jsx"></script>
<script type="text/babel" src="ServicesScreen.jsx"></script>
</head>
<body><div id="root"></div>
<script type="text/babel">
const { BottomNav } = window.CarTrakDesignSystem_588b8a;

function ScanSheet({ onClose }) {
  return (
    <div onClick={onClose} style={{ position:'absolute', inset:0, background:'rgba(26,26,26,0.45)', display:'flex', alignItems:'flex-end', zIndex:20 }}>
      <div onClick={(e)=>e.stopPropagation()} style={{ width:'100%', background:'#fff', borderTopLeftRadius:28, borderTopRightRadius:28, padding:'26px 24px 34px', textAlign:'center' }}>
        <div style={{ width:44, height:4, borderRadius:2, background:'var(--ink-200)', margin:'0 auto 20px' }} />
        <div style={{ width:120, height:120, borderRadius:'50%', background:'var(--red-50)', display:'flex', alignItems:'center', justifyContent:'center', margin:'0 auto 18px' }}>
          <Icon n="ScanLine" s={54} color="var(--brand)" />
        </div>
        <div style={{ font:'800 22px var(--font-sans)', color:'var(--ink-900)' }}>Scan your vehicle</div>
        <p style={{ font:'400 15px/1.5 var(--font-serif-body)', color:'var(--ink-600)', margin:'8px 0 20px' }}>Point your camera at the VIN or dashboard to run instant diagnostics.</p>
        <button onClick={onClose} style={{ width:'100%', padding:'16px', borderRadius:999, border:'none', background:'var(--brand)', color:'#fff', font:'700 16px var(--font-sans)', boxShadow:'var(--shadow-brand)', cursor:'pointer' }}>Start scan</button>
      </div>
    </div>
  );
}

function App() {
  const [started, setStarted] = React.useState(false);
  const [tab, setTab] = React.useState('home');
  const [scan, setScan] = React.useState(false);

  let screen;
  if (tab === 'home') screen = <HomeScreen />;
  else if (tab === 'reports') screen = <ServicesScreen />;
  else screen = <HomeScreen />;

  return (
    <PhoneFrame bg={started ? 'var(--surface-page)' : '#fff'}>
      {!started ? <HeroScreen onStart={() => setStarted(true)} /> : (
        <>
          <div style={{ flex:1, minHeight:0 }}>{screen}</div>
          <div style={{ position:'absolute', left:0, right:0, bottom:0 }}>
            <BottomNav active={tab} onChange={setTab} fabIcon={<Icon n="ScanLine" s={26} />} onFab={() => setScan(true)}
              items={[
                { key:'home', label:'Home', icon:<Icon n="House" s={22} /> },
                { key:'reports', label:'Reports', icon:<Icon n="ChartColumn" s={22} /> },
                { key:'saved', label:'Saved', icon:<Icon n="Heart" s={22} /> },
                { key:'settings', label:'Settings', icon:<Icon n="Settings" s={22} /> },
              ]} />
          </div>
          {scan && <ScanSheet onClose={() => setScan(false)} />}
        </>
      )}
    </PhoneFrame>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body></html>
