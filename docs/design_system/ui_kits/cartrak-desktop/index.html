<!-- @dsCard group="CarTrak Desktop" viewport="1440x900" name="CarTrak — Desktop Dashboard" subtitle="Sidebar + top bar + vehicle dashboard" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>CarTrak Desktop</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<style>
  html,body{margin:0;height:100%}
  body{font-family:var(--font-sans);background:var(--surface-page)}
  *{box-sizing:border-box}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--ink-200);border-radius:8px}
  #app{display:flex;height:100vh}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" src="kit.jsx"></script>
<script type="text/babel" src="Sidebar.jsx"></script>
<script type="text/babel" src="TopBar.jsx"></script>
<script type="text/babel" src="Dashboard.jsx"></script>
</head>
<body><div id="root"></div>
<script type="text/babel">
function ScanModal({ onClose }) {
  return (
    <div onClick={onClose} style={{ position:'fixed', inset:0, background:'rgba(26,26,26,0.5)', display:'flex', alignItems:'center', justifyContent:'center', zIndex:50 }}>
      <div onClick={(e)=>e.stopPropagation()} style={{ width:440, background:'#fff', borderRadius:28, padding:'36px', textAlign:'center', boxShadow:'var(--shadow-lg)' }}>
        <div style={{ width:120, height:120, borderRadius:'50%', background:'var(--red-50)', display:'flex', alignItems:'center', justifyContent:'center', margin:'0 auto 18px' }}>
          <Icon n="ScanLine" s={54} color="var(--brand)" />
        </div>
        <div style={{ font:'800 24px var(--font-sans)', color:'var(--ink-900)' }}>Scan your vehicle</div>
        <p style={{ font:'400 15px/1.6 var(--font-serif-body)', color:'var(--ink-600)', margin:'10px 0 22px' }}>Connect the CarTrak OBD reader or use your phone camera on the VIN to run instant diagnostics.</p>
        <button onClick={onClose} style={{ width:'100%', padding:'16px', borderRadius:999, border:'none', background:'var(--brand)', color:'#fff', font:'700 16px var(--font-sans)', boxShadow:'var(--shadow-brand)', cursor:'pointer' }}>Start scan</button>
      </div>
    </div>
  );
}

function App() {
  const [tab, setTab] = React.useState('home');
  const [scan, setScan] = React.useState(false);
  return (
    <div id="app">
      <Sidebar active={tab} onChange={setTab} onScan={() => setScan(true)} />
      <div style={{ flex:1, display:'flex', flexDirection:'column', minWidth:0 }}>
        <TopBar />
        <Dashboard />
      </div>
      {scan && <ScanModal onClose={() => setScan(false)} />}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body></html>
